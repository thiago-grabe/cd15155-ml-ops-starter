# Pre-merge validation.
#
# WHY: ci-cd.yml only triggers on push to main, so a PR could be merged green and
# immediately red the default branch — which is exactly what happened. This runs the same
# gates against the PR head, plus a real image build, so failures surface BEFORE merge.
#
# Deliberately does NOT push to ECR or deploy to ECS: a PR must be able to prove the image
# builds without mutating any shared environment.

name: PR validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push to the PR cancels the in-flight run for that PR.
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: starter

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.4
      - run: ruff check app/ scripts/ tests/ monitoring/
      - run: ruff format --check app/ scripts/ tests/ monitoring/
        continue-on-error: true   # advisory: formatting is not yet enforced

  config-validation:
    name: Config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # .env is git-ignored, and compose errors on a missing env_file, so seed it
      # from the template exactly as a developer would.
      - name: Seed .env from the template
        run: cp .env.example .env

      - name: Validate docker-compose
        run: docker compose config --quiet

      - name: Assert the rubric keys are present on the api service
        run: |
          python - <<'PY'
          import yaml, json, sys
          api = yaml.safe_load(open("docker-compose.yml"))["services"]["api"]
          checks = {
            "build":        bool(api.get("build")),
            "container port 8000": any("8000" in str(p).split(":")[-1] for p in api.get("ports", [])),
            "env_file .env": any(".env" in str(e) for e in api.get("env_file", [])),
            "mlruns mount":  any("mlruns" in str(v) for v in api.get("volumes", [])),
            "mlartifacts mount": any("mlartifacts" in str(v) for v in api.get("volumes", [])),
            "extra_hosts host-gateway": any("host-gateway" in str(h) for h in api.get("extra_hosts", [])),
            "healthcheck /health": "/health" in json.dumps(api.get("healthcheck", {})),
          }
          for k, v in checks.items():
              print(("OK   " if v else "MISS ") + k)
          sys.exit(0 if all(checks.values()) else 1)
          PY

      - name: Assert the DVC pipeline contract
        run: |
          python - <<'PY'
          import yaml, sys
          stages = yaml.safe_load(open("dvc.yaml"))["stages"]
          want = {
            "prepare": (["scripts/load_data.py"], ["prepare.test_size","prepare.random_seed"],
                        ["data/train.csv","data/test.csv"]),
            "clean":   (["scripts/clean_data.py","data/raw_stream.csv"],
                        ["clean.min_words","clean.max_words"], ["data/stream.csv"]),
          }
          ok = True
          for name, (deps, params, outs) in want.items():
              st = stages.get(name, {})
              for key, expected in (("deps", deps), ("params", params), ("outs", outs)):
                  missing = [e for e in expected if e not in (st.get(key) or [])]
                  if missing:
                      print(f"MISS {name}.{key}: {missing}"); ok = False
                  else:
                      print(f"OK   {name}.{key}")
          sys.exit(0 if ok else 1)
          PY

      - name: Assert the Prometheus scrape contract
        run: |
          python - <<'PY'
          import yaml, sys
          d = yaml.safe_load(open("prometheus.yml"))
          sc = d["scrape_configs"][0]
          checks = {
            'job_name finbert-api': sc.get("job_name") == "finbert-api",
            'scrape_interval 15s':  sc.get("scrape_interval") == "15s"
                                    or d.get("global", {}).get("scrape_interval") == "15s",
            'target api:8000':      any("api:8000" in str(t)
                                        for g in sc.get("static_configs", []) for t in g.get("targets", [])),
          }
          for k, v in checks.items():
              print(("OK   " if v else "MISS ") + k)
          sys.exit(0 if all(checks.values()) else 1)
          PY

      - name: Assert dvc.lock is committed
        run: test -f dvc.lock && echo "OK   dvc.lock present"

  test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      MODEL_SOURCE: huggingface
      HF_MODEL_ID: baptle/FinBERT_market_based
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: starter/requirements.txt

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-finbert-market-based-v1

      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          pip install -r requirements.txt

      - name: Download and patch the model
        run: python scripts/smoke_test.py

      - run: pytest tests/ -v

  deepchecks:
    name: Model quality gate
    runs-on: ubuntu-latest
    needs: lint
    env:
      MODEL_SOURCE: huggingface
      HF_MODEL_ID: baptle/FinBERT_market_based
      HF_DATASET_ID: baptle/financial_headlines_market_based
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: starter/requirements.txt

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-finbert-market-based-v1

      # deepchecks fetches the fasttext language-ID model from dl.fbaipublicfiles.com on
      # first use. Caching it keeps the drift gate off the network on repeat runs; a
      # read timeout there previously made this job flaky.
      - name: Cache deepchecks NLP models
        uses: actions/cache@v4
        with:
          path: ~/.deepchecks
          key: deepchecks-models-${{ runner.os }}-v1

      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          pip install -r requirements.txt

      - name: Pre-fetch the fasttext language model
        run: |
          python - <<'PY'
          from deepchecks.nlp.utils.text_properties_models import get_fasttext_model
          for attempt in range(3):
              try:
                  get_fasttext_model(); print("fasttext lid model ready"); break
              except Exception as e:
                  print(f"attempt {attempt+1} failed: {e}")
          else:
              raise SystemExit("could not fetch the fasttext model after 3 attempts")
          PY

      - name: Generate datasets
        run: dvc repro

      - name: Download and patch the model
        run: python scripts/smoke_test.py

      - run: python scripts/run_deepchecks.py

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # Builds for the same platform Fargate runs, and does NOT push. This is the check
      # that would have caught a broken Dockerfile before it reached main.
      - name: Build the API image (amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: starter
          file: starter/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          build-args: BAKE_MODEL=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image layers
        run: echo "API image built for linux/amd64 without pushing."

  summary:
    name: PR gate
    runs-on: ubuntu-latest
    needs: [lint, config-validation, test, deepchecks, docker-build]
    if: always()
    steps:
      - name: Fail if any gate failed
        run: |
          RESULTS='${{ toJSON(needs) }}'
          echo "$RESULTS"
          echo "$RESULTS" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          bad=[k for k,v in d.items() if v['result'] not in ('success','skipped')]
          for k,v in d.items(): print(f\"  {v['result']:>10}  {k}\")
          if bad:
              print('\nFAILED:', ', '.join(bad)); sys.exit(1)
          print('\nAll pre-merge gates passed.')
          "
