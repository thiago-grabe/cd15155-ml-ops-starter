# CI/CD for the FinBERT sentiment service.
#
# NOTE ON LOCATION: this file MUST live at the REPOSITORY ROOT .github/workflows/.
# GitHub Actions only reads that path — a copy under starter/.github/workflows/ is
# never executed (it is kept there only as the graded project deliverable).
#
# `defaults.run.working-directory` applies to `run:` steps ONLY. Every `uses:` action
# input that names a file must be repo-root-relative (e.g. starter/requirements.txt).
#
# AWS credentials here are temporary Vocareum STS credentials, so AWS_SESSION_TOKEN is
# mandatory alongside the key id and secret, and all three expire (see docs/AWS_SETUP.md).

name: test-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ECR_REPOSITORY: finbert-api
  TASK_DEFINITION: finbert-api
  CONTAINER_NAME: finbert-api
  ECS_SERVICE: finbert-api-service
  ECS_CLUSTER: finbert-cluster   # starter shipped `finbert-api`, which is the task-def name

defaults:
  run:
    working-directory: starter

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: an unpinned ruff broke main when 0.16 enabled new rules by
      # default. Rules themselves are pinned in starter/ruff.toml.
      - run: pip install ruff==0.16.4
      - run: ruff check app/ scripts/ tests/ monitoring/

  test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      MODEL_SOURCE: huggingface
      HF_MODEL_ID: baptle/FinBERT_market_based
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: starter/requirements.txt

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-finbert-market-based-v1

      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          pip install -r requirements.txt

      - name: Download and patch the model
        run: python scripts/smoke_test.py

      - name: Run integration tests
        run: pytest tests/ -v

  deepchecks:
    name: Model quality gate
    runs-on: ubuntu-latest
    needs: lint
    env:
      MODEL_SOURCE: huggingface
      HF_MODEL_ID: baptle/FinBERT_market_based
      HF_DATASET_ID: baptle/financial_headlines_market_based
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: starter/requirements.txt

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-finbert-market-based-v1

      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          pip install -r requirements.txt

      - name: Generate datasets
        run: dvc repro

      - name: Download and patch the model
        run: python scripts/smoke_test.py

      - name: Run Deepchecks drift gate
        run: python scripts/run_deepchecks.py

  build:
    name: Build and Push to ECR
    runs-on: ubuntu-latest     # amd64, matching the Fargate X86_64 task definition
    needs: [test, deepchecks]
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG="$(git rev-parse --short HEAD)-$(date +%Y%m%d%H%M%S)"
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$TAG"
          LATEST="$REGISTRY/$ECR_REPOSITORY:latest"

          docker build -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE and $LATEST"

  deploy:
    name: Deploy to ECS Fargate
    runs-on: ubuntu-latest
    needs: build
    # Environment protection rule: configure a required reviewer on the "production"
    # environment in repo Settings to gate this job behind manual approval.
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION" \
            --query 'taskDefinition' \
          | jq 'del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy,
                  .deregisteredAt,
                  .deleteRequestedAt
                )' > "$GITHUB_WORKSPACE/task-definition.json"
          echo "Fields stripped: register-task-definition rejects all nine read-only keys."

      - name: Render task definition with the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          # Repo-root-relative: `uses:` inputs ignore defaults.run.working-directory.
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build.outputs.image }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Report the public endpoint
        run: |
          TASK_ARN=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" --desired-status RUNNING \
            --query 'taskArns[0]' --output text)
          ENI=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value | [0]" \
            --output text)
          IP=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI" \
            --query 'NetworkInterfaces[0].Association.PublicIp' --output text)
          echo "Service is live at http://$IP:8000/health"
          echo "### Deployed: http://$IP:8000/health" >> "$GITHUB_STEP_SUMMARY"
